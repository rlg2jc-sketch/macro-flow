<body class="bg-stone-50 dark:bg-zinc-950 text-stone-800 dark:text-zinc-100 font-sans antialiased transition-colors">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icon Components
    const IconSparkles = () => <svg className="w-5 h-5 text-amber-400 dark:text-zinc-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;
    const IconZap = ({ className = "w-4 h-4" }) => <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>;
    const IconHistory = () => <svg className="w-4 h-4 text-stone-600 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconCalculator = () => <svg className="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m-6 4h6m-6 4h6M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>;
    const IconSettings = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>;
    const IconSun = () => <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
    const IconMoon = () => <svg className="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>;
    const IconFlame = () => <svg className="w-5 h-5 text-amber-700 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>;
    const IconDumbbell = () => <svg className="w-5 h-5 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>;
    const IconWheat = () => <svg className="w-5 h-5 text-emerald-700 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v18m0-18C9 7 5 7 5 11s4 4 7 4m0-15c3 4 7 4 7 8s-4 4-7 4"/></svg>;
    const IconDroplet = () => <svg className="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>;
    const IconPlus = ({ className = "w-4 h-4" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>;
    const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
    const IconPencil = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>;
    const IconCheck = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>;
    const IconUtensils = () => <svg className="w-4 h-4 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>;
    const IconSearch = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
    const IconRotateCcw = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>;
    const IconTarget = () => <svg className="w-4 h-4 text-stone-600 dark:text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" strokeWidth="2"/><circle cx="12" cy="12" r="6" strokeWidth="2"/><circle cx="12" cy="12" r="2" strokeWidth="2"/></svg>;

    // Built-in Precision Food Dictionary (Standard Whole Foods & Drinks)
    const BUILTIN_FOOD_DB = {
      'apple': { name: 'Apple (Medium, 182g)', serving: '1 medium apple', calories: 95, protein: 0.5, carbs: 25, fat: 0.3 },
      'banana': { name: 'Banana (Medium, 118g)', serving: '1 medium banana', calories: 105, protein: 1.3, carbs: 27, fat: 0.3 },
      'orange': { name: 'Orange (Medium, 131g)', serving: '1 medium orange', calories: 62, protein: 1.2, carbs: 15.4, fat: 0.2 },
      'egg': { name: 'Large Egg (50g)', serving: '1 large egg', calories: 72, protein: 6.3, carbs: 0.4, fat: 4.8 },
      'eggs': { name: 'Large Egg (50g)', serving: '1 large egg', calories: 72, protein: 6.3, carbs: 0.4, fat: 4.8 },
      'black coffee': { name: 'Black Coffee (16 oz)', serving: '1 Medium (16 oz)', calories: 5, protein: 0.3, carbs: 0, fat: 0 },
      'iced coffee black': { name: 'Iced Black Coffee (16 oz)', serving: '1 Medium (16 oz)', calories: 5, protein: 0.3, carbs: 0, fat: 0 },
      'light iced caramel coffee': { name: 'Light Iced Caramel Coffee', serving: '1 Medium (16 oz)', calories: 70, protein: 1, carbs: 14, fat: 1 },
      'chicken breast': { name: 'Chicken Breast (Cooked, 100g)', serving: '100g portion', calories: 165, protein: 31, carbs: 0, fat: 3.6 },
      'salmon': { name: 'Atlantic Salmon (Cooked, 100g)', serving: '100g portion', calories: 206, protein: 22, carbs: 0, fat: 12 },
      'steak': { name: 'Beef Sirloin Steak (100g)', serving: '100g portion', calories: 244, protein: 27, carbs: 0, fat: 14 },
      'white rice': { name: 'White Rice (Cooked, 1 cup, 158g)', serving: '1 cup cooked', calories: 205, protein: 4.2, carbs: 45, fat: 0.4 },
      'brown rice': { name: 'Brown Rice (Cooked, 1 cup, 195g)', serving: '1 cup cooked', calories: 218, protein: 4.5, carbs: 46, fat: 1.6 },
      'oats': { name: 'Rolled Oats (Dry, 40g)', serving: '1/2 cup dry', calories: 150, protein: 5, carbs: 27, fat: 2.5 },
      'oatmeal': { name: 'Oatmeal (Cooked, 1 cup, 234g)', serving: '1 cup cooked', calories: 166, protein: 5.9, carbs: 28, fat: 3.6 },
      'greek yogurt': { name: 'Plain Greek Yogurt (Nonfat, 170g)', serving: '1 container (170g)', calories: 100, protein: 17, carbs: 6, fat: 0.7 },
      'avocado': { name: 'Avocado (Medium, 150g)', serving: '1 medium avocado', calories: 240, protein: 3, carbs: 12, fat: 22 },
      'peanut butter': { name: 'Peanut Butter (2 tbsp, 32g)', serving: '2 tbsp (32g)', calories: 188, protein: 8, carbs: 7, fat: 16 },
      'almonds': { name: 'Whole Almonds (28g / 1 oz)', serving: '1 oz (28g)', calories: 164, protein: 6, carbs: 6, fat: 14 },
      'sweet potato': { name: 'Sweet Potato (Medium Baked, 114g)', serving: '1 medium potato', calories: 103, protein: 2.3, carbs: 24, fat: 0.2 },
      'broccoli': { name: 'Broccoli (Chopped, 1 cup, 91g)', serving: '1 cup raw', calories: 31, protein: 2.6, carbs: 6, fat: 0.3 },
      'spinach': { name: 'Fresh Spinach (1 cup, 30g)', serving: '1 cup raw', calories: 7, protein: 0.9, carbs: 1.1, fat: 0.1 },
    };

    const safeLoad = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        localStorage.removeItem(key);
        return fallback;
      }
    };

    const DEFAULT_TARGETS = { calories: 2000, protein: 150, carbs: 200, fat: 65 };
    const QUICK_PRESETS = [
      { name: 'Chicken Breast (200g)', mealType: 'Lunch', calories: 330, protein: 62, carbs: 0, fat: 7 },
      { name: 'Oatmeal & Protein Powder', mealType: 'Breakfast', calories: 380, protein: 32, carbs: 45, fat: 6 },
      { name: 'Greek Yogurt (200g) + Berries', mealType: 'Snack', calories: 180, protein: 18, carbs: 20, fat: 2 },
      { name: 'Rice (150g Cooked)', mealType: 'Dinner', calories: 195, protein: 4, carbs: 43, fat: 0.5 },
      { name: 'Whey Protein Shake', mealType: 'Snack', calories: 120, protein: 24, carbs: 3, fat: 1.5 },
    ];

    const getESTDateString = () => {
      try {
        return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
      } catch (e) {
        return new Date().toISOString().split('T')[0];
      }
    };

    function App() {
      const [darkMode, setDarkMode] = useState(() => safeLoad('macros_theme', true));
      const [targets, setTargets] = useState(() => safeLoad('macros_targets', DEFAULT_TARGETS));
      const [historyLogs, setHistoryLogs] = useState(() => safeLoad('macros_history_logs', {}));
      
      const currentEstDate = getESTDateString();
      const [entries, setEntries] = useState(() => {
        const logs = safeLoad('macros_history_logs', {});
        return Array.isArray(logs[currentEstDate]) ? logs[currentEstDate] : [];
      });

      const [foodName, setFoodName] = useState('');
      const [calories, setCalories] = useState('');
      const [protein, setProtein] = useState('');
      const [carbs, setCarbs] = useState('');
      const [fat, setFat] = useState('');
      const [portionQty, setPortionQty] = useState('1');
      const [portionUnit, setPortionUnit] = useState('serving');
      const [mealType, setMealType] = useState('Breakfast');
      const [showQuickAdd, setShowQuickAdd] = useState(false);

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showCalcModal, setShowCalcModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [showSearchModal, setShowSearchModal] = useState(false);
      const [tempTargets, setTempTargets] = useState(targets);

      const [searchQuery, setSearchQuery] = useState('');
      const [isSearching, setIsSearching] = useState(false);
      const [searchResult, setSearchResult] = useState(null);
      const [searchPortionQty, setSearchPortionQty] = useState('1');
      const [searchTargetMeal, setSearchTargetMeal] = useState('Snack');

      const [editingEntryId, setEditingEntryId] = useState(null);
      const [editFormData, setEditFormData] = useState({ name: '', mealType: 'Breakfast', calories: '', protein: '', carbs: '', fat: '' });

      const [calcData, setCalcData] = useState({
        unit: 'lbs', gender: 'male', age: 28, heightFt: 5, heightIn: 10, heightCm: 178,
        currentWeight: 180, targetWeight: 165, timelineWeeks: 12, activityLevel: 1.375, proteinRatio: 1.0,
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('macros_theme', JSON.stringify(darkMode));
      }, [darkMode]);

      useEffect(() => {
        const updatedHistory = { ...historyLogs, [currentEstDate]: entries };
        setHistoryLogs(updatedHistory);
        localStorage.setItem('macros_history_logs', JSON.stringify(updatedHistory));
      }, [entries]);

      useEffect(() => { localStorage.setItem('macros_targets', JSON.stringify(targets)); }, [targets]);

      const consumed = useMemo(() => {
        return entries.reduce(
          (acc, entry) => ({
            calories: acc.calories + Number(entry.calories || 0),
            protein: acc.protein + Number(entry.protein || 0),
            carbs: acc.carbs + Number(entry.carbs || 0),
            fat: acc.fat + Number(entry.fat || 0),
          }),
          { calories: 0, protein: 0, carbs: 0, fat: 0 }
        );
      }, [entries]);

      const calculatedPlan = useMemo(() => {
        const isLbs = calcData.unit === 'lbs';
        const weightKg = isLbs ? calcData.currentWeight * 0.453592 : calcData.currentWeight;
        const heightCm = isLbs ? (calcData.heightFt * 12 + calcData.heightIn) * 2.54 : calcData.heightCm;
        let bmr = 10 * weightKg + 6.25 * heightCm - 5 * calcData.age + (calcData.gender === 'male' ? 5 : -161);
        const tdee = Math.round(bmr * calcData.activityLevel);
        const targetCalories = Math.max(1200, Math.round(tdee - ((calcData.currentWeight - calcData.targetWeight) * (isLbs ? 3500 : 7700) / (calcData.timelineWeeks * 7))));
        const targetProtein = Math.round((isLbs ? calcData.currentWeight : calcData.currentWeight * 2.20462) * calcData.proteinRatio);
        const targetFat = Math.round((targetCalories * 0.25) / 9);
        const targetCarbs = Math.max(0, Math.round((targetCalories - targetProtein * 4 - targetFat * 9) / 4));
        return { targetCalories, targetProtein, targetCarbs, targetFat };
      }, [calcData]);

      const handleAddEntry = (e) => {
        e.preventDefault();
        if (!foodName.trim() || !calories) return;
        const qty = parseFloat(portionQty) || 1;
        const baseCal = parseFloat(calories) || 0;
        const baseP = parseFloat(protein) || 0;
        const baseC = parseFloat(carbs) || 0;
        const baseF = parseFloat(fat) || 0;

        const newEntry = {
          id: Date.now().toString(),
          name: foodName.trim(),
          portionQty: qty,
          portionUnit,
          baseCalories: baseCal,
          baseProtein: baseP,
          baseCarbs: baseC,
          baseFat: baseF,
          mealType,
          calories: Math.round(baseCal * qty),
          protein: Math.round(baseP * qty * 10) / 10,
          carbs: Math.round(baseC * qty * 10) / 10,
          fat: Math.round(baseF * qty * 10) / 10,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        };
        setEntries([newEntry, ...entries]);
        setFoodName(''); setCalories(''); setProtein(''); setCarbs(''); setFat(''); setPortionQty('1');
      };

      const handleUpdatePortion = (id, newQty) => {
        const qty = parseFloat(newQty) || 0.1;
        setEntries(entries.map(entry => {
          if (entry.id !== id) return entry;
          
          const baseCal = entry.baseCalories !== undefined ? entry.baseCalories : (entry.calories / (entry.portionQty || 1));
          const baseP = entry.baseProtein !== undefined ? entry.baseProtein : (entry.protein / (entry.portionQty || 1));
          const baseC = entry.baseCarbs !== undefined ? entry.baseCarbs : (entry.carbs / (entry.portionQty || 1));
          const baseF = entry.baseFat !== undefined ? entry.baseFat : (entry.fat / (entry.portionQty || 1));

          return {
            ...entry,
            portionQty: qty,
            baseCalories: baseCal,
            baseProtein: baseP,
            baseCarbs: baseC,
            baseFat: baseF,
            calories: Math.round(baseCal * qty),
            protein: Math.round(baseP * qty * 10) / 10,
            carbs: Math.round(baseC * qty * 10) / 10,
            fat: Math.round(baseF * qty * 10) / 10,
          };
        }));
      };

      const handleStartEdit = (entry) => {
        setEditingEntryId(entry.id);
        setEditFormData({
          name: entry.name,
          mealType: entry.mealType,
          calories: entry.calories.toString(),
          protein: entry.protein.toString(),
          carbs: entry.carbs.toString(),
          fat: entry.fat.toString(),
        });
      };

      const handleSaveEdit = (id) => {
        const cal = parseFloat(editFormData.calories) || 0;
        const p = parseFloat(editFormData.protein) || 0;
        const c = parseFloat(editFormData.carbs) || 0;
        const f = parseFloat(editFormData.fat) || 0;

        setEntries(entries.map(entry => {
          if (entry.id !== id) return entry;
          return {
            ...entry,
            name: editFormData.name.trim() || entry.name,
            mealType: editFormData.mealType,
            portionQty: 1,
            baseCalories: cal,
            baseProtein: p,
            baseCarbs: c,
            baseFat: f,
            calories: Math.round(cal),
            protein: Math.round(p * 10) / 10,
            carbs: Math.round(c * 10) / 10,
            fat: Math.round(f * 10) / 10,
          };
        }));
        setEditingEntryId(null);
      };

      // Hybrid Food Lookup System (Built-in Dictionary -> Live Open Food Facts API -> Categorized Smart Estimator)
      const handleAISearch = async (e) => {
        e.preventDefault();
        const rawQuery = searchQuery.trim().toLowerCase();
        if (!rawQuery) return;
        setIsSearching(true);

        // 1. Check Built-in Dictionary (Whole Foods & Drinks)
        if (BUILTIN_FOOD_DB[rawQuery]) {
          const match = BUILTIN_FOOD_DB[rawQuery];
          setSearchResult({ ...match, source: 'Verified Whole Food' });
          setIsSearching(false);
          return;
        }

        // Search partial matches in Built-in DB (e.g. "red apple")
        const partialKey = Object.keys(BUILTIN_FOOD_DB).find(k => rawQuery.includes(k) || k.includes(rawQuery));
        if (partialKey) {
          const match = BUILTIN_FOOD_DB[partialKey];
          setSearchResult({ ...match, name: searchQuery, source: 'Verified Whole Food' });
          setIsSearching(false);
          return;
        }

        // 2. Fetch from Live Open Food Facts API (Branded & Packaged Products)
        try {
          const apiRes = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(rawQuery)}&search_simple=1&action=process&json=1&page_size=1`);
          const data = await apiRes.json();

          if (data && data.products && data.products.length > 0) {
            const prod = data.products[0];
            const nutriments = prod.nutriments || {};

            const calPer100 = nutriments['energy-kcal_100g'] ?? nutriments['energy-kcal'] ?? 200;
            const pPer100 = nutriments['proteins_100g'] ?? nutriments['proteins'] ?? 5;
            const cPer100 = nutriments['carbohydrates_100g'] ?? nutriments['carbohydrates'] ?? 25;
            const fPer100 = nutriments['fat_100g'] ?? nutriments['fat'] ?? 8;

            const servingText = prod.serving_size || '100g serving';

            setSearchResult({
              name: prod.product_name || searchQuery,
              serving: servingText,
              calories: Math.round(calPer100),
              protein: Math.round(pPer100 * 10) / 10,
              carbs: Math.round(cPer100 * 10) / 10,
              fat: Math.round(fPer100 * 10) / 10,
              source: 'Open Food Facts DB'
            });
            setIsSearching(false);
            return;
          }
        } catch (err) {
          console.warn("Live API lookup offline, switching to Category Estimator", err);
        }

        // 3. Smart Category Parser (For custom, unbranded, or restaurant orders)
        let res = { name: searchQuery, serving: '1 standard portion', calories: 250, protein: 12, carbs: 30, fat: 8, source: 'Smart Estimator' };
        
        if (rawQuery.includes('coffee') || rawQuery.includes('latte') || rawQuery.includes('espresso')) {
          const isLight = rawQuery.includes('black') || rawQuery.includes('skim') || rawQuery.includes('almond') || rawQuery.includes('sugar free') || rawQuery.includes('light') || rawQuery.includes('splash');
          const hasCaramel = rawQuery.includes('caramel');

          if (isLight && hasCaramel) {
            res = { name: searchQuery, serving: '1 Medium (16 oz)', calories: 70, protein: 1, carbs: 14, fat: 1, source: 'Light Beverage DB' };
          } else if (hasCaramel) {
            res = { name: searchQuery, serving: '1 Medium (16 oz)', calories: 230, protein: 4, carbs: 38, fat: 7, source: 'Commercial Beverage DB' };
          } else if (isLight) {
            res = { name: searchQuery, serving: '1 Medium (16 oz)', calories: 25, protein: 1, carbs: 3, fat: 1, source: 'Beverage DB' };
          } else {
            res = { name: searchQuery, serving: '1 Medium (16 oz)', calories: 140, protein: 3, carbs: 22, fat: 4, source: 'Beverage DB' };
          }
        } else if (rawQuery.includes('chipotle') || rawQuery.includes('burrito') || rawQuery.includes('taco')) {
          res = { name: searchQuery, serving: '1 Meal Portion', calories: 650, protein: 54, carbs: 68, fat: 18, source: 'Restaurant DB' };
        } else if (rawQuery.includes('chicken') || rawQuery.includes('turkey') || rawQuery.includes('salmon') || rawQuery.includes('tuna')) {
          res = { name: searchQuery, serving: '150g portion', calories: 240, protein: 42, carbs: 0, fat: 7, source: 'Protein DB' };
        }

        setSearchResult(res);
        setIsSearching(false);
      };

      const handleAddSearchResult = () => {
        if (!searchResult) return;
        const mult = parseFloat(searchPortionQty) || 1;
        const newEntry = {
          id: Date.now().toString(),
          name: searchResult.name,
          portionQty: mult,
          portionUnit: searchResult.serving,
          baseCalories: searchResult.calories,
          baseProtein: searchResult.protein,
          baseCarbs: searchResult.carbs,
          baseFat: searchResult.fat,
          mealType: searchTargetMeal,
          calories: Math.round(searchResult.calories * mult),
          protein: Math.round(searchResult.protein * mult * 10) / 10,
          carbs: Math.round(searchResult.carbs * mult * 10) / 10,
          fat: Math.round(searchResult.fat * mult * 10) / 10,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        };
        setEntries([newEntry, ...entries]);
        setShowSearchModal(false);
        setSearchResult(null);
        setSearchQuery('');
      };

      const meals = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
      const macroCards = [
        { title: 'Calories', unit: 'kcal', used: consumed.calories, target: targets.calories, color: 'text-amber-700 dark:text-amber-400', barColor: 'bg-amber-500', icon: IconFlame },
        { title: 'Protein', unit: 'g', used: consumed.protein, target: targets.protein, color: 'text-indigo-600 dark:text-indigo-400', barColor: 'bg-indigo-500', icon: IconDumbbell },
        { title: 'Carbs', unit: 'g', used: consumed.carbs, target: targets.carbs, color: 'text-emerald-700 dark:text-emerald-400', barColor: 'bg-emerald-500', icon: IconWheat },
        { title: 'Fat', unit: 'g', used: consumed.fat, target: targets.fat, color: 'text-rose-600 dark:text-rose-400', barColor: 'bg-rose-500', icon: IconDroplet },
      ];

      return (
        <div className="min-h-screen bg-stone-50 dark:bg-zinc-950 text-stone-800 dark:text-zinc-100 font-sans transition-colors pb-20">
          {/* Header */}
          <header className="sticky top-0 z-30 backdrop-blur-md bg-stone-50/80 dark:bg-zinc-950/80 border-b border-stone-200/60 dark:border-zinc-800/60">
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-stone-900 to-stone-700 dark:from-zinc-100 dark:to-zinc-300 flex items-center justify-center shadow-md">
                  <IconSparkles />
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-stone-900 to-stone-600 dark:from-zinc-100 dark:to-zinc-400 bg-clip-text text-transparent">MacroFlow</h1>
                  <p className="text-[11px] font-medium text-stone-500 uppercase tracking-wide hidden sm:block">Chic Daily Atelier</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button onClick={() => setShowSearchModal(true)} className="p-2.5 rounded-xl bg-stone-900 dark:bg-zinc-100 text-stone-100 dark:text-zinc-900 hover:opacity-90 flex items-center space-x-2 text-xs font-semibold">
                  <IconZap className="w-4 h-4 text-amber-400 dark:text-stone-900" />
                  <span className="hidden sm:inline">AI Lookup</span>
                </button>
                <button onClick={() => setShowHistoryModal(true)} className="p-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/50 flex items-center space-x-2 text-xs font-medium">
                  <IconHistory />
                  <span className="hidden sm:inline">History</span>
                </button>
                <button onClick={() => setShowCalcModal(true)} className="p-2.5 rounded-xl bg-stone-100 dark:bg-zinc-800/60 text-stone-700 dark:text-zinc-300 flex items-center space-x-2 text-xs font-medium border border-stone-200 dark:border-zinc-700">
                  <IconCalculator />
                  <span className="hidden sm:inline">Calculator</span>
                </button>
                <button onClick={() => { setTempTargets(targets); setShowSettingsModal(true); }} className="p-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/50 text-stone-600 dark:text-zinc-400">
                  <IconSettings />
                </button>
                <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/50">
                  {darkMode ? <IconSun /> : <IconMoon />}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-6xl mx-auto px-4 py-8 space-y-8">
            {/* Macro Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {macroCards.map((card) => {
                const CardIcon = card.icon;
                const pct = Math.min(100, Math.round((card.used / card.target) * 100));
                const remaining = Math.max(0, card.target - card.used);

                return (
                  <div key={card.title} className="rounded-2xl border border-stone-200/70 dark:border-zinc-800/80 bg-white/80 dark:bg-zinc-900/80 p-5 shadow-sm">
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center space-x-3">
                        <div className="p-2.5 rounded-xl bg-stone-100 dark:bg-zinc-800">
                          <CardIcon />
                        </div>
                        <div>
                          <h3 className="font-semibold text-stone-900 dark:text-zinc-100 text-sm">{card.title}</h3>
                          <p className="text-xs text-stone-500">Goal: {card.target} {card.unit}</p>
                        </div>
                      </div>
                      <span className="text-xs font-semibold px-2 py-0.5 rounded-md bg-stone-100 dark:bg-zinc-800 text-stone-600 dark:text-zinc-300">{pct}%</span>
                    </div>
                    <div className="space-y-2">
                      <div className="flex justify-between items-baseline text-xs">
                        <span className="text-2xl font-bold text-stone-900 dark:text-zinc-100 tracking-tight">
                          {Math.round(card.used)} <span className="text-xs font-normal text-stone-500">{card.unit}</span>
                        </span>
                        <span className="text-stone-500 font-medium">{Math.round(remaining)} {card.unit} left</span>
                      </div>
                      <div className="h-1.5 rounded-full bg-stone-100 dark:bg-zinc-800 overflow-hidden">
                        <div className={`h-full rounded-full transition-all duration-500 ${card.barColor}`} style={{ width: `${pct}%` }} />
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              {/* Intake Form */}
              <section className="lg:col-span-5 space-y-6">
                <div className="rounded-2xl border border-stone-200/70 dark:border-zinc-800/80 bg-white dark:bg-zinc-900 p-6 shadow-sm">
                  <div className="flex items-center justify-between mb-5">
                    <div className="flex items-center space-x-2">
                      <IconUtensils />
                      <h2 className="text-sm font-bold uppercase tracking-wider">Log Intake</h2>
                    </div>
                    <button onClick={() => setShowQuickAdd(!showQuickAdd)} className="text-xs text-stone-500 hover:text-stone-900 dark:hover:text-zinc-100">
                      {showQuickAdd ? 'Hide Presets' : 'Presets'}
                    </button>
                  </div>

                  {showQuickAdd && (
                    <div className="mb-6 p-3 bg-stone-50 dark:bg-zinc-800/40 rounded-xl border border-stone-200/50 dark:border-zinc-700/50 flex flex-wrap gap-1.5">
                      {QUICK_PRESETS.map((p, idx) => (
                        <button key={idx} onClick={() => setEntries([{ ...p, id: Date.now().toString(), portionQty: 1, baseCalories: p.calories, baseProtein: p.protein, baseCarbs: p.carbs, baseFat: p.fat, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }, ...entries])} className="text-xs bg-white dark:bg-zinc-800 border border-stone-200 dark:border-zinc-700 rounded-lg px-2.5 py-1.5 flex items-center space-x-1">
                          <IconPlus /> <span>{p.name}</span>
                        </button>
                      ))}
                    </div>
                  )}

                  <form onSubmit={handleAddEntry} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-stone-500 mb-1">Food Name</label>
                      <input type="text" required placeholder="e.g. Avocado Toast" value={foodName} onChange={(e) => setFoodName(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-medium text-stone-500 mb-1">Portion Qty</label>
                        <input type="number" step="any" value={portionQty} onChange={(e) => setPortionQty(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-stone-500 mb-1">Meal</label>
                        <select value={mealType} onChange={(e) => setMealType(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm">
                          {meals.map(m => <option key={m} value={m}>{m}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-medium text-stone-500 mb-1">Calories/unit</label>
                        <input type="number" required value={calories} onChange={(e) => setCalories(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-stone-500 mb-1">Protein/unit (g)</label>
                        <input type="number" value={protein} onChange={(e) => setProtein(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-stone-500 mb-1">Carbs/unit (g)</label>
                        <input type="number" value={carbs} onChange={(e) => setCarbs(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-stone-500 mb-1">Fat/unit (g)</label>
                        <input type="number" value={fat} onChange={(e) => setFat(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50/50 dark:bg-zinc-950 text-sm" />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl bg-stone-900 dark:bg-zinc-100 text-stone-100 dark:text-zinc-900 font-semibold text-xs tracking-wider uppercase flex items-center justify-center space-x-2">
                      <IconPlus /> <span>Add Entry</span>
                    </button>
                  </form>
                </div>
              </section>

              {/* Log List */}
              <section className="lg:col-span-7 space-y-6">
                <div className="rounded-2xl border border-stone-200/70 dark:border-zinc-800/80 bg-white dark:bg-zinc-900 p-6 shadow-sm">
                  <div className="flex items-center justify-between mb-6 pb-4 border-b border-stone-100 dark:border-zinc-800">
                    <h2 className="text-sm font-bold uppercase tracking-wider">Today's Log ({entries.length})</h2>
                    {entries.length > 0 && (
                      <button onClick={() => setEntries([])} className="text-xs text-rose-500 hover:text-rose-600 flex items-center space-x-1">
                        <IconRotateCcw /> <span>Reset</span>
                      </button>
                    )}
                  </div>

                  {entries.length === 0 ? (
                    <p className="text-center py-12 text-xs text-stone-400">No food logged today.</p>
                  ) : (
                    <div className="space-y-6">
                      {meals.map(m => {
                        const mealEntries = entries.filter(e => e.mealType === m);
                        if (mealEntries.length === 0) return null;

                        return (
                          <div key={m} className="space-y-3">
                            <div className="text-xs font-semibold uppercase text-stone-500">{m}</div>
                            <div className="space-y-2">
                              {mealEntries.map(entry => (
                                <div key={entry.id} className="p-3.5 rounded-xl border border-stone-100 dark:border-zinc-800 bg-stone-50/40 dark:bg-zinc-950/40 space-y-2">
                                  {editingEntryId === entry.id ? (
                                    <div className="space-y-3 p-2 bg-white dark:bg-zinc-900 rounded-lg border border-amber-500/30">
                                      <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-amber-600 dark:text-amber-400">Edit Entry</span>
                                        <button onClick={() => setEditingEntryId(null)} className="text-xs text-stone-400">Cancel</button>
                                      </div>
                                      <div>
                                        <input type="text" value={editFormData.name} onChange={(e) => setEditFormData({ ...editFormData, name: e.target.value })} className="w-full px-2.5 py-1.5 text-xs rounded border dark:border-zinc-700 bg-stone-50 dark:bg-zinc-950" placeholder="Food Name" />
                                      </div>
                                      <div className="grid grid-cols-2 gap-2">
                                        <select value={editFormData.mealType} onChange={(e) => setEditFormData({ ...editFormData, mealType: e.target.value })} className="px-2 py-1 text-xs rounded border dark:border-zinc-700 bg-stone-50 dark:bg-zinc-950">
                                          {meals.map(type => <option key={type} value={type}>{type}</option>)}
                                        </select>
                                        <input type="number" placeholder="Calories" value={editFormData.calories} onChange={(e) => setEditFormData({ ...editFormData, calories: e.target.value })} className="px-2 py-1 text-xs rounded border dark:border-zinc-700 bg-stone-50 dark:bg-zinc-950" />
                                      </div>
                                      <div className="grid grid-cols-3 gap-2">
                                        <input type="number" placeholder="Protein (g)" value={editFormData.protein} onChange={(e) => setEditFormData({ ...editFormData, protein: e.target.value })} className="px-2 py-1 text-xs rounded border dark:border-zinc-700 bg-stone-50 dark:bg-zinc-950" />
                                        <input type="number" placeholder="Carbs (g)" value={editFormData.carbs} onChange={(e) => setEditFormData({ ...editFormData, carbs: e.target.value })} className="px-2 py-1 text-xs rounded border dark:border-zinc-700 bg-stone-50 dark:bg-zinc-950" />
                                        <input type="number" placeholder="Fat (g)" value={editFormData.fat} onChange={(e) => setEditFormData({ ...editFormData, fat: e.target.value })} className="px-2 py-1 text-xs rounded border dark:border-zinc-700 bg-stone-50 dark:bg-zinc-950" />
                                      </div>
                                      <button onClick={() => handleSaveEdit(entry.id)} className="w-full py-1.5 rounded bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs flex items-center justify-center space-x-1">
                                        <IconCheck /> <span>Save Changes</span>
                                      </button>
                                    </div>
                                  ) : (
                                    <div>
                                      <div className="flex items-center justify-between">
                                        <div>
                                          <span className="text-sm font-semibold">{entry.name}</span>
                                          <span className="text-[10px] text-stone-500 ml-2">{entry.timestamp}</span>
                                        </div>
                                        <div className="flex items-center space-x-1">
                                          <button onClick={() => handleStartEdit(entry)} className="p-1 text-stone-400 hover:text-amber-500 transition-colors" title="Edit details">
                                            <IconPencil />
                                          </button>
                                          <button onClick={() => setEntries(entries.filter(e => e.id !== entry.id))} className="p-1 text-stone-400 hover:text-rose-500 transition-colors">
                                            <IconTrash />
                                          </button>
                                        </div>
                                      </div>
                                      <div className="flex items-center justify-between mt-2 pt-2 border-t border-stone-100 dark:border-zinc-800/60 text-xs">
                                        <div className="flex items-center space-x-3 font-mono">
                                          <span className="font-bold text-amber-700 dark:text-amber-400">{entry.calories} kcal</span>
                                          <span>P: {entry.protein}g</span>
                                          <span>C: {entry.carbs}g</span>
                                          <span>F: {entry.fat}g</span>
                                        </div>
                                        <div className="flex items-center space-x-1 bg-stone-100 dark:bg-zinc-800/80 p-0.5 rounded-lg">
                                          <span className="text-[10px] text-stone-500 px-1 font-medium">Qty:</span>
                                          {[0.5, 1, 1.5, 2].map(m => (
                                            <button key={m} onClick={() => handleUpdatePortion(entry.id, m)} className={`px-1.5 py-0.5 text-[10px] rounded font-medium ${Number(entry.portionQty) === m ? 'bg-white dark:bg-zinc-900 text-stone-900 dark:text-zinc-100 shadow-sm' : 'text-stone-500 hover:text-stone-900'}`}>
                                              {m}x
                                            </button>
                                          ))}
                                        </div>
                                      </div>
                                    </div>
                                  )}
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </section>
            </div>
          </main>

          {/* AI Search Modal */}
          {showSearchModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 dark:bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl shadow-xl overflow-hidden border border-stone-200 dark:border-zinc-800">
                <div className="p-6 border-b border-stone-100 dark:border-zinc-800 flex justify-between items-center bg-gradient-to-r from-amber-50 to-rose-50 dark:from-zinc-900 dark:to-zinc-900">
                  <div className="flex items-center space-x-2 text-amber-600 dark:text-amber-400">
                    <IconZap />
                    <h3 className="font-bold">Hybrid Food Lookup</h3>
                  </div>
                  <button onClick={() => setShowSearchModal(false)} className="text-stone-400 hover:text-stone-600 dark:hover:text-zinc-300">✕</button>
                </div>
                <div className="p-6 space-y-4">
                  <form onSubmit={handleAISearch} className="relative">
                    <input type="text" placeholder="e.g. light iced caramel coffee, apple, egg" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-xl border border-stone-200 dark:border-zinc-800 bg-stone-50 dark:bg-zinc-950 text-sm" />
                    <div className="absolute left-3 top-3.5 text-stone-400"><IconSearch /></div>
                    <button type="submit" className="mt-3 w-full py-2.5 rounded-xl bg-stone-900 dark:bg-zinc-100 text-stone-100 dark:text-zinc-900 font-semibold text-xs flex items-center justify-center space-x-2">
                      {isSearching ? <span>Searching Database...</span> : <span>Lookup Macros</span>}
                    </button>
                  </form>
                  
                  {searchResult && (
                    <div className="mt-4 p-4 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-800/50">
                      <div className="flex justify-between items-start mb-3">
                        <div>
                          <p className="font-bold text-sm text-stone-900 dark:text-zinc-100">{searchResult.name}</p>
                          <p className="text-[10px] text-amber-600 dark:text-amber-400 font-bold uppercase">{searchResult.source} • {searchResult.serving}</p>
                        </div>
                        <span className="text-amber-600 dark:text-amber-400 font-bold text-sm">{Math.round(searchResult.calories * (parseFloat(searchPortionQty) || 1))} kcal</span>
                      </div>
                      <div className="grid grid-cols-3 gap-2 mb-4 text-xs font-mono">
                        <div className="bg-white dark:bg-zinc-900 p-2 rounded flex flex-col items-center"><span className="text-stone-400 text-[10px]">PRO</span><span className="font-semibold">{Math.round(searchResult.protein * (parseFloat(searchPortionQty) || 1) * 10) / 10}g</span></div>
                        <div className="bg-white dark:bg-zinc-900 p-2 rounded flex flex-col items-center"><span className="text-stone-400 text-[10px]">CRB</span><span className="font-semibold">{Math.round(searchResult.carbs * (parseFloat(searchPortionQty) || 1) * 10) / 10}g</span></div>
                        <div className="bg-white dark:bg-zinc-900 p-2 rounded flex flex-col items-center"><span className="text-stone-400 text-[10px]">FAT</span><span className="font-semibold">{Math.round(searchResult.fat * (parseFloat(searchPortionQty) || 1) * 10) / 10}g</span></div>
                      </div>
                      <div className="grid grid-cols-2 gap-2 mb-4">
                        <div>
                          <label className="block text-[10px] font-medium text-stone-500 mb-1">Portion Multiplier</label>
                          <input type="number" step="0.5" value={searchPortionQty} onChange={e => setSearchPortionQty(e.target.value)} className="w-full px-2 py-1.5 rounded border dark:border-zinc-700 text-xs bg-white dark:bg-zinc-900" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-medium text-stone-500 mb-1">Meal</label>
                          <select value={searchTargetMeal} onChange={e => setSearchTargetMeal(e.target.value)} className="w-full px-2 py-1.5 rounded border dark:border-zinc-700 text-xs bg-white dark:bg-zinc-900">
                            {meals.map(m => <option key={m} value={m}>{m}</option>)}
                          </select>
                        </div>
                      </div>
                      <button onClick={handleAddSearchResult} className="w-full py-2 rounded-lg bg-amber-500 text-white font-bold text-xs">Add to Log</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Macro Calculator Modal */}
          {showCalcModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 dark:bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-lg bg-white dark:bg-zinc-900 rounded-3xl shadow-xl overflow-hidden border border-stone-200 dark:border-zinc-800 max-h-[90vh] overflow-y-auto">
                <div className="p-6 border-b border-stone-100 dark:border-zinc-800 flex justify-between items-center sticky top-0 bg-white dark:bg-zinc-900 z-10">
                  <h3 className="font-bold text-stone-900 dark:text-zinc-100 flex items-center space-x-2">
                    <IconCalculator /> <span>Goal Calculator</span>
                  </h3>
                  <button onClick={() => setShowCalcModal(false)} className="text-stone-400 hover:text-stone-600">✕</button>
                </div>
                <div className="p-6 space-y-6">
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs text-stone-500 mb-1">Gender</label><select value={calcData.gender} onChange={e=>setCalcData({...calcData, gender: e.target.value})} className="w-full p-2 text-sm rounded border dark:border-zinc-700 bg-transparent"><option value="male">Male</option><option value="female">Female</option></select></div>
                    <div><label className="block text-xs text-stone-500 mb-1">Age</label><input type="number" value={calcData.age} onChange={e=>setCalcData({...calcData, age: Number(e.target.value)})} className="w-full p-2 text-sm rounded border dark:border-zinc-700 bg-transparent" /></div>
                    <div><label className="block text-xs text-stone-500 mb-1">Weight ({calcData.unit})</label><input type="number" value={calcData.currentWeight} onChange={e=>setCalcData({...calcData, currentWeight: Number(e.target.value)})} className="w-full p-2 text-sm rounded border dark:border-zinc-700 bg-transparent" /></div>
                    <div><label className="block text-xs text-stone-500 mb-1">Target Weight</label><input type="number" value={calcData.targetWeight} onChange={e=>setCalcData({...calcData, targetWeight: Number(e.target.value)})} className="w-full p-2 text-sm rounded border dark:border-zinc-700 bg-transparent" /></div>
                  </div>
                  <div><label className="block text-xs text-stone-500 mb-1">Activity Level</label><select value={calcData.activityLevel} onChange={e=>setCalcData({...calcData, activityLevel: Number(e.target.value)})} className="w-full p-2 text-sm rounded border dark:border-zinc-700 bg-transparent"><option value="1.2">Sedentary</option><option value="1.375">Lightly Active</option><option value="1.55">Moderately Active</option><option value="1.725">Very Active</option></select></div>
                  <div className="p-4 bg-stone-50 dark:bg-zinc-800/50 rounded-xl border border-stone-200 dark:border-zinc-700">
                    <p className="text-xs font-semibold mb-3">Suggested Targets</p>
                    <div className="grid grid-cols-4 gap-2 text-center text-xs">
                      <div><div className="font-bold text-amber-600">{calculatedPlan.targetCalories}</div><div className="text-[10px] text-stone-500">KCAL</div></div>
                      <div><div className="font-bold text-indigo-600">{calculatedPlan.targetProtein}g</div><div className="text-[10px] text-stone-500">PRO</div></div>
                      <div><div className="font-bold text-emerald-600">{calculatedPlan.targetCarbs}g</div><div className="text-[10px] text-stone-500">CRB</div></div>
                      <div><div className="font-bold text-rose-600">{calculatedPlan.targetFat}g</div><div className="text-[10px] text-stone-500">FAT</div></div>
                    </div>
                  </div>
                  <button onClick={() => { setTargets({ calories: calculatedPlan.targetCalories, protein: calculatedPlan.targetProtein, carbs: calculatedPlan.targetCarbs, fat: calculatedPlan.targetFat }); setShowCalcModal(false); }} className="w-full py-3 rounded-xl bg-stone-900 dark:bg-zinc-100 text-stone-100 dark:text-zinc-900 font-semibold text-sm">Apply to My Dashboard</button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 dark:bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-sm bg-white dark:bg-zinc-900 rounded-3xl shadow-xl overflow-hidden border border-stone-200 dark:border-zinc-800">
                <div className="p-6 border-b border-stone-100 dark:border-zinc-800 flex justify-between items-center">
                  <h3 className="font-bold text-stone-900 dark:text-zinc-100 flex items-center space-x-2">
                    <IconTarget /> <span>Manual Overrides</span>
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-stone-400 hover:text-stone-600">✕</button>
                </div>
                <div className="p-6 space-y-4">
                  {['calories', 'protein', 'carbs', 'fat'].map(macro => (
                    <div key={macro}>
                      <label className="block text-xs font-medium text-stone-500 mb-1 capitalize">{macro} Target</label>
                      <input type="number" value={tempTargets[macro]} onChange={(e) => setTempTargets({...tempTargets, [macro]: Number(e.target.value)})} className="w-full p-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-transparent text-sm" />
                    </div>
                  ))}
                  <button onClick={() => { setTargets(tempTargets); setShowSettingsModal(false); }} className="w-full py-3 mt-2 rounded-xl bg-stone-900 dark:bg-zinc-100 text-stone-100 dark:text-zinc-900 font-semibold text-sm">Save Manual Targets</button>
                </div>
              </div>
            </div>
          )}

          {/* History Modal */}
          {showHistoryModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 dark:bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl shadow-xl overflow-hidden border border-stone-200 dark:border-zinc-800 max-h-[80vh] flex flex-col">
                <div className="p-6 border-b border-stone-100 dark:border-zinc-800 flex justify-between items-center">
                  <h3 className="font-bold text-stone-900 dark:text-zinc-100 flex items-center space-x-2">
                    <IconHistory /> <span>Past Logs</span>
                  </h3>
                  <button onClick={() => setShowHistoryModal(false)} className="text-stone-400 hover:text-stone-600">✕</button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 space-y-4">
                  {Object.keys(historyLogs).length === 0 ? <p className="text-xs text-stone-500 text-center py-8">No history yet.</p> : 
                    Object.entries(historyLogs).sort((a,b) => b[0].localeCompare(a[0])).map(([date, dateEntries]) => {
                      const safeEntries = Array.isArray(dateEntries) ? dateEntries : [];
                      return (
                        <div key={date} className="p-4 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-800/30">
                          <div className="font-bold text-sm mb-2">{date === currentEstDate ? 'Today' : date}</div>
                          <div className="text-xs space-y-1 text-stone-600 dark:text-zinc-400">
                            {safeEntries.length} items logged • {safeEntries.reduce((s, e) => s + Number(e.calories || 0), 0)} kcal total
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
